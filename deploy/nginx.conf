# Goblin L00t — nginx reverse proxy.
#
# Serves:
#   * /api/*    → app:8080 (api-server, includes Clerk proxy at /api/__clerk)
#   * /*        → static dashboard built by Vite (mounted from app image)
#
# TLS termination is intentionally OUT of scope for this container. The
# expected production setup is one of:
#   (a) terminate TLS at this nginx with a `listen 443 ssl` server block +
#       certbot (certs mounted from host into /etc/letsencrypt)
#   (b) terminate TLS at an upstream load-balancer (Cloudflare, AWS ALB,
#       etc.) and forward HTTP to this container on port 80.
# Either way, the api-server expects `X-Forwarded-Proto: https` so Clerk
# proxy + secure cookies + Twitch OAuth callbacks resolve correctly.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;

  # Gzip text assets — the dashboard bundle is the bulk of the payload.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css application/json application/javascript
    text/xml application/xml application/xml+rss text/javascript
    image/svg+xml;

  # Cap upload size — generous for image uploads, blocks abuse.
  client_max_body_size 10m;

  # Trust X-Forwarded-* ONLY from private/loopback CIDRs (the docker
  # bridge network where this container lives + the standard RFC1918
  # ranges where any front-of-nginx LB would sit). Without this scoping
  # any client could spoof X-Forwarded-For and break per-IP rate limits
  # or audit logs. If your TLS-terminating LB lives on a public IP,
  # ADD that IP/CIDR explicitly — do NOT widen this to 0.0.0.0/0.
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;

  upstream goblin_api {
    server app:8080;
    keepalive 16;
  }

  server {
    listen 80 default_server;
    server_name _;

    # ---- API + Clerk proxy ----
    # /api also covers /api/__clerk, /api/stripe/webhook (raw body —
    # critical that nginx does NOT rewrite or buffer it weirdly).
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "";
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      # Stripe webhook delivery + Clerk frontend-API request bodies must
      # arrive byte-identical to what the upstream sees.
      proxy_request_buffering off;
      proxy_pass http://goblin_api;
      proxy_read_timeout 60s;
    }

    # ---- Static dashboard ----
    root /var/www/dashboard;
    index index.html;

    # Hashed Vite assets — long cache, immutable.
    location /assets/ {
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Everything else falls through to the SPA shell so Wouter routing works.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
