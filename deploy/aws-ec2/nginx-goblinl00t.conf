# /etc/nginx/sites-available/goblinl00t.com
#
# Serves the dashboard static bundle from /opt/goblinl00t/web and proxies
# /api/* to the Node service on localhost:8080. Drop in alongside (or
# replacing) the site config that currently serves /opt/goblinl00t/web.
#
# Install:
#   sudo cp deploy/aws-ec2/nginx-goblinl00t.conf /etc/nginx/sites-available/goblinl00t.com
#   sudo ln -sf /etc/nginx/sites-available/goblinl00t.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS:  After the HTTP block is up and serving, run:
#         sudo certbot --nginx -d goblinl00t.com -d www.goblinl00t.com
#       Certbot will rewrite this file to add the 443 server block + redirect.

upstream goblin_api {
  server 127.0.0.1:8080;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name goblinl00t.com www.goblinl00t.com;

  root /opt/goblinl00t/web;
  index index.html;

  client_max_body_size 10m;
  server_tokens off;

  # Gzip text assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             image/svg+xml;

  # ---- API + Clerk proxy + Stripe webhook ----
  # Stripe webhook signature verification + Clerk frontend-API both need
  # the request body byte-identical, hence proxy_request_buffering off.
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "";
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_request_buffering off;
    proxy_pass http://goblin_api;
    proxy_read_timeout 60s;
  }

  # ---- Static dashboard ----
  # Hashed Vite assets — long cache, immutable.
  location /assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback so Wouter routes (e.g. /giveaway/123) resolve correctly.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
