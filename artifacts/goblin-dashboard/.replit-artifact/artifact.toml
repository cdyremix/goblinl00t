kind = "web"
previewPath = "/"
title = "Goblin L00t Dashboard"
version = "1.0.0"
id = "artifacts/goblin-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19458

[services.development]
run = "pnpm --filter @workspace/goblin-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/goblin-dashboard", "run", "build" ]
publicDir = "artifacts/goblin-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19458"
BASE_PATH = "/"
