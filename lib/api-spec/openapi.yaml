openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Goblin L00t API - Twitch bot + giveaway dashboard
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot
    description: Bot status and control
  - name: giveaway
    description: Giveaway management
  - name: loot
    description: Loot drop logs
  - name: stats
    description: Statistics and analytics
  - name: commands
    description: Bot command configuration
  - name: settings
    description: Bot theme and user settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get bot connection status
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/restart:
    post:
      operationId: restartBot
      tags: [bot]
      summary: Restart the bot
      responses:
        "200":
          description: Bot restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /giveaway:
    get:
      operationId: listGiveaways
      tags: [giveaway]
      summary: List giveaways
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, ended]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of giveaways
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Giveaway"
    post:
      operationId: createGiveaway
      tags: [giveaway]
      summary: Create a new giveaway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiveawayInput"
      responses:
        "201":
          description: Giveaway created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Giveaway"

  /giveaway/current:
    get:
      operationId: getCurrentGiveaway
      tags: [giveaway]
      summary: Get currently active giveaway
      responses:
        "200":
          description: Active giveaway or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiveawayWithEntries"

  /giveaway/{id}:
    get:
      operationId: getGiveaway
      tags: [giveaway]
      summary: Get a giveaway by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Giveaway details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiveawayWithEntries"
        "404":
          description: Not found

  /giveaway/{id}/start:
    post:
      operationId: startGiveaway
      tags: [giveaway]
      summary: Start a giveaway (bot announces in chat)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Giveaway started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Giveaway"

  /giveaway/{id}/end:
    post:
      operationId: endGiveaway
      tags: [giveaway]
      summary: End giveaway and pick winner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Giveaway ended with winner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiveawayResult"

  /giveaway/{id}/reroll:
    post:
      operationId: rerollGiveaway
      tags: [giveaway]
      summary: Reroll winner for ended giveaway
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New winner picked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiveawayResult"

  /giveaway/{id}/entries:
    get:
      operationId: getGiveawayEntries
      tags: [giveaway]
      summary: Get entries for a giveaway
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entries list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GiveawayEntry"

  /loot/recent:
    get:
      operationId: getRecentLoot
      tags: [loot]
      summary: Get recent loot drops
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Recent loot drops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LootDrop"

  /stats/overview:
    get:
      operationId: getStatsOverview
      tags: [stats]
      summary: Get dashboard overview stats
      responses:
        "200":
          description: Overview statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /stats/commands:
    get:
      operationId: getCommandStats
      tags: [stats]
      summary: Get command usage statistics
      responses:
        "200":
          description: Command usage stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommandStat"

  /stats/top-looters:
    get:
      operationId: getTopLooters
      tags: [stats]
      summary: Get top users by loot count
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Top looters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserStat"

  /commands:
    get:
      operationId: listCommands
      tags: [commands]
      summary: List all bot commands and their status
      responses:
        "200":
          description: Command list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BotCommand"

  /settings:
    get:
      operationId: getBotSettings
      tags: [settings]
      summary: Get current user bot settings
      responses:
        "200":
          description: Bot settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSettings"
        "401":
          description: Unauthorized
    put:
      operationId: updateBotSettings
      tags: [settings]
      summary: Update bot settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBotSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSettings"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /commands/{name}/toggle:
    post:
      operationId: toggleCommand
      tags: [commands]
      summary: Enable or disable a bot command
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Command toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotCommand"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BotStatus:
      type: object
      properties:
        connected:
          type: boolean
        channel:
          type: string
        username:
          type: string
        uptime:
          type: ["integer", "null"]
        lastMessageAt:
          type: ["string", "null"]
      required:
        - connected
        - channel
        - username
        - uptime
        - lastMessageAt

    Giveaway:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        prize:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, active, ended]
        channel:
          type: string
        keyword:
          type: string
        maxEntries:
          type: ["integer", "null"]
        winnerId:
          type: ["integer", "null"]
        winnerUsername:
          type: ["string", "null"]
        entryCount:
          type: integer
        createdAt:
          type: string
        startedAt:
          type: ["string", "null"]
        endedAt:
          type: ["string", "null"]
      required:
        - id
        - title
        - prize
        - description
        - status
        - channel
        - keyword
        - maxEntries
        - winnerId
        - winnerUsername
        - entryCount
        - createdAt
        - startedAt
        - endedAt

    GiveawayInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        prize:
          type: string
          minLength: 1
        description:
          type: string
        keyword:
          type: string
          minLength: 1
        maxEntries:
          type: integer
        channel:
          type: string
      required:
        - title
        - prize
        - keyword

    GiveawayEntry:
      type: object
      properties:
        id:
          type: integer
        giveawayId:
          type: integer
        username:
          type: string
        tickets:
          type: integer
        enteredAt:
          type: string
      required:
        - id
        - giveawayId
        - username
        - tickets
        - enteredAt

    GiveawayWithEntries:
      type: object
      properties:
        giveaway:
          $ref: "#/components/schemas/Giveaway"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/GiveawayEntry"
      required:
        - giveaway
        - entries

    GiveawayResult:
      type: object
      properties:
        giveaway:
          $ref: "#/components/schemas/Giveaway"
        winner:
          $ref: "#/components/schemas/GiveawayEntry"
      required:
        - giveaway
        - winner

    LootDrop:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        item:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, epic, legendary]
        points:
          type: integer
        channel:
          type: string
        droppedAt:
          type: string
      required:
        - id
        - username
        - item
        - rarity
        - points
        - channel
        - droppedAt

    StatsOverview:
      type: object
      properties:
        totalGiveaways:
          type: integer
        activeGiveaway:
          type: boolean
        totalLootDrops:
          type: integer
        totalCommandsUsed:
          type: integer
        uniqueUsers:
          type: integer
        recentEntries:
          type: integer
      required:
        - totalGiveaways
        - activeGiveaway
        - totalLootDrops
        - totalCommandsUsed
        - uniqueUsers
        - recentEntries

    CommandStat:
      type: object
      properties:
        command:
          type: string
        usageCount:
          type: integer
        lastUsedAt:
          type: ["string", "null"]
      required:
        - command
        - usageCount
        - lastUsedAt

    UserStat:
      type: object
      properties:
        username:
          type: string
        lootCount:
          type: integer
        totalPoints:
          type: integer
        bestRarity:
          type: string
      required:
        - username
        - lootCount
        - totalPoints
        - bestRarity

    BotCommand:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        cooldownSeconds:
          type: integer
      required:
        - name
        - description
        - enabled
        - cooldownSeconds

    BotSettings:
      type: object
      properties:
        botTheme:
          type: string
          enum: [goblin, cs2]
        steamTradeUrl:
          type: ["string", "null"]
      required:
        - botTheme
        - steamTradeUrl

    UpdateBotSettings:
      type: object
      properties:
        botTheme:
          type: string
          enum: [goblin, cs2]
        steamTradeUrl:
          type: ["string", "null"]
