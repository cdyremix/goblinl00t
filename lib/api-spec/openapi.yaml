openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Goblin L00t API - Twitch bot + giveaway dashboard
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot
    description: Bot status and control
  - name: giveaway
    description: Giveaway management
  - name: loot
    description: Loot drop logs
  - name: stats
    description: Statistics and analytics
  - name: commands
    description: Bot command configuration
  - name: settings
    description: Bot theme and user settings
  - name: trade
    description: Giveaway winner trade fulfillment
  - name: steam
    description: Steam inventory integration
  - name: chat-users
    description: Chat user management (coins + inventory)

paths:
  /auth/admin-bypass:
    post:
      operationId: adminBypassSignIn
      tags: [auth]
      summary: >
        Issue a Clerk sign-in ticket for an admin or dev user using the global
        bypass code. Works in all environments; the backend validates that the
        user is isAdmin or isDev before minting the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBypassBody"
      responses:
        "200":
          description: Bypass ticket granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBypassResult"
        "401":
          description: Wrong code or user is not admin/dev
        "404":
          description: No user with that email
        "429":
          description: Rate limited

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get bot connection status
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/restart:
    post:
      operationId: restartBot
      tags: [bot]
      summary: Restart the bot
      responses:
        "200":
          description: Bot restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /giveaway:
    get:
      operationId: listGiveaways
      tags: [giveaway]
      summary: List giveaways
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, ended]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of giveaways
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Giveaway"
    post:
      operationId: createGiveaway
      tags: [giveaway]
      summary: Create a new giveaway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiveawayInput"
      responses:
        "201":
          description: Giveaway created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Giveaway"

  /giveaway/current:
    get:
      operationId: getCurrentGiveaway
      tags: [giveaway]
      summary: Get currently active giveaway
      responses:
        "200":
          description: Active giveaway or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiveawayWithEntries"

  /giveaway/{id}:
    get:
      operationId: getGiveaway
      tags: [giveaway]
      summary: Get a giveaway by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Giveaway details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiveawayWithEntries"
        "404":
          description: Not found
    delete:
      operationId: deleteGiveaway
      tags: [giveaway]
      summary: Permanently delete a giveaway and its entries
      description: |
        Removes the giveaway row and any associated entries / trade
        fulfillment rows. Coin awards already credited to winners are NOT
        clawed back (they live in `loot_drops`). Use this to clean up test
        / aborted giveaways from the Loot Hoard list.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Giveaway deleted
        "404":
          description: Not found

  /giveaway/{id}/start:
    post:
      operationId: startGiveaway
      tags: [giveaway]
      summary: Start a giveaway (bot announces in chat)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Giveaway started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Giveaway"

  /giveaway/{id}/end:
    post:
      operationId: endGiveaway
      tags: [giveaway]
      summary: End giveaway and record the winner
      description: |
        Records the giveaway as ended with a winner. Two flows:

        - **Wheel-driven (dashboard)**: client supplies `winnerUsername`
          (the last contender standing on the elimination wheel). Server
          validates the name is in the entries pool before recording.
        - **Automated / no-body**: server falls back to a weighted-random
          pick from the entries (legacy chat / scripted callers).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndGiveawayRequest"
      responses:
        "200":
          description: Giveaway ended with winner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiveawayResult"

  /giveaway/{id}/reroll:
    post:
      operationId: rerollGiveaway
      tags: [giveaway]
      summary: Reroll winner for ended giveaway
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New winner picked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiveawayResult"

  /giveaway/{id}/restart:
    post:
      operationId: restartGiveaway
      tags: [giveaway]
      summary: Re-open an ended giveaway (clears winner, status → active)
      description: |
        Returns an ended giveaway to active status, clearing the previously
        chosen winner. All existing entries are preserved so the streamer
        can reshuffle / draw again from the same pool, or open more entries
        from chat. Coin awards already credited to the previous winner are
        NOT clawed back.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Giveaway re-opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Giveaway"
        "404":
          description: Not found

  /giveaway/seed-test:
    post:
      operationId: seedTestGiveaway
      tags: [giveaway]
      summary: Create an active test giveaway pre-loaded with dummy entries
      description: |
        Dev/test helper. Ends any currently active giveaway for the caller's
        channel, creates a fresh `active` giveaway with a coin prize, and
        inserts ~30 fake entries with varied ticket counts so the streamer
        can immediately try the elimination wheel.
      responses:
        "201":
          description: Test giveaway created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Giveaway"
        "401":
          description: Unauthorized

  /giveaway/{id}/seed-entries:
    post:
      operationId: seedGiveawayEntries
      tags: [giveaway]
      summary: Bulk-insert fake entries into an existing giveaway (test helper)
      description: |
        Dev/test helper. Inserts ~30 fake entries with varied ticket counts
        into the specified giveaway. Uses onConflictDoNothing on (giveawayId,
        username) so calling it twice is safe — duplicates are skipped.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entries seeded; returns updated giveaway with entryCount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Giveaway"
        "404":
          description: Giveaway not found

  /giveaway/{id}/entries:
    get:
      operationId: getGiveawayEntries
      tags: [giveaway]
      summary: Get entries for a giveaway
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entries list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GiveawayEntry"
    post:
      operationId: addGiveawayEntry
      tags: [giveaway]
      summary: Manually add an entry to a giveaway (streamer only)
      description: |
        Streamer-only manual entry insert. Useful for re-adding viewers who
        had connection issues, or seeding a giveaway with off-platform
        participants. Username is normalised to lowercase. If an entry for
        the same username already exists, its ticket count is incremented.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGiveawayEntryInput"
      responses:
        "201":
          description: Entry added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiveawayEntry"
        "400":
          description: Invalid input or giveaway already ended
        "404":
          description: Giveaway not found

  /giveaway/{id}/entries/{entryId}:
    delete:
      operationId: deleteGiveawayEntry
      tags: [giveaway]
      summary: Manually remove an entry from a giveaway (streamer only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Entry deleted
        "404":
          description: Entry or giveaway not found

  /points/me:
    get:
      operationId: getMyPoints
      tags: [points]
      summary: Get loot coin balance for the authenticated user
      responses:
        "200":
          description: Coin balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointsBalance"
        "401":
          description: Unauthorized

  /inventory/me:
    get:
      operationId: getMyInventory
      tags: [inventory]
      summary: List the authenticated user's loot inventory (capped)
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInventory"
        "401":
          description: Unauthorized

  /inventory/{itemId}/sell:
    post:
      operationId: sellInventoryItem
      tags: [inventory]
      summary: Sell an inventory item for coins
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sale completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellItemResult"
        "401":
          description: Unauthorized
        "404":
          description: Item not found

  /inventory/{itemId}/use:
    post:
      operationId: useInventoryItem
      tags: [inventory]
      summary: Activate a buff item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Buff activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseItemResult"
        "400":
          description: Item is not a buff
        "401":
          description: Unauthorized
        "404":
          description: Item not found

  /giveaway/{id}/redeem:
    post:
      operationId: redeemEntries
      tags: [giveaway]
      summary: Redeem loot points for extra entries (manual override)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemEntriesInput"
      responses:
        "200":
          description: Redemption result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionResult"

  /loot/recent:
    get:
      operationId: getRecentLoot
      tags: [loot]
      summary: Get recent loot drops
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: since
          in: query
          description: Time window filter. `stream` resolves to caller's streamStartedAt.
          schema:
            type: string
            enum: [day, week, month, year, stream]
      responses:
        "200":
          description: Recent loot drops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LootDrop"

  /stats/overview:
    get:
      operationId: getStatsOverview
      tags: [stats]
      summary: Get dashboard overview stats
      parameters:
        - $ref: "#/components/parameters/StatsRange"
      responses:
        "200":
          description: Overview statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /stats/commands:
    get:
      operationId: getCommandStats
      tags: [stats]
      summary: Get command usage statistics
      parameters:
        - $ref: "#/components/parameters/StatsRange"
      responses:
        "200":
          description: Command usage stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommandStat"

  /stats/top-looters:
    get:
      operationId: getTopLooters
      tags: [stats]
      summary: Get top users by loot count
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - $ref: "#/components/parameters/StatsRange"
      responses:
        "200":
          description: Top looters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserStat"

  /stats/engagement:
    get:
      operationId: getEngagementReport
      tags: [stats]
      summary: Get engagement tips and metrics for the selected window
      parameters:
        - $ref: "#/components/parameters/StatsRange"
      responses:
        "200":
          description: Engagement report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementReport"

  /stream/status:
    get:
      operationId: getStreamStatus
      tags: [stats]
      summary: Get the caller's current stream session status
      responses:
        "200":
          description: Stream status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamStatus"
        "401":
          description: Unauthorized

  /stream/start:
    post:
      operationId: startStreamSession
      tags: [stats]
      summary: Mark the caller's stream session as started (timestamps now)
      responses:
        "200":
          description: Stream started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamStatus"
        "401":
          description: Unauthorized

  /stream/end:
    post:
      operationId: endStreamSession
      tags: [stats]
      summary: Clear the caller's stream session (sets streamStartedAt to null)
      responses:
        "200":
          description: Stream ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamStatus"
        "401":
          description: Unauthorized

  /giveaway-presets:
    get:
      operationId: listGiveawayPresets
      tags: [giveaway]
      summary: List the caller's saved giveaway presets
      responses:
        "200":
          description: Preset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GiveawayPreset"
        "401":
          description: Unauthorized
    post:
      operationId: createGiveawayPreset
      tags: [giveaway]
      summary: Save a new giveaway preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGiveawayPreset"
      responses:
        "201":
          description: Preset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiveawayPreset"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /giveaway-presets/{id}:
    delete:
      operationId: deleteGiveawayPreset
      tags: [giveaway]
      summary: Delete a saved preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /giveaway-presets/{id}/launch:
    post:
      operationId: launchGiveawayPreset
      tags: [giveaway]
      summary: Create a new pending giveaway from a preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Giveaway created from preset
          content:
            application/json:
              schema:
                type: object
                properties:
                  giveawayId:
                    type: integer
                  status:
                    type: string
                required: [giveawayId, status]
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /commands:
    get:
      operationId: listCommands
      tags: [commands]
      summary: List all bot commands and their status
      responses:
        "200":
          description: Command list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BotCommand"

  /trade-fulfillments:
    get:
      operationId: listTradeFulfillments
      tags: [trade]
      summary: List all giveaway winner trade records
      responses:
        "200":
          description: Trade fulfillment records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeFulfillment"
        "401":
          description: Unauthorized

  /trade-fulfillments/{id}:
    put:
      operationId: updateTradeFulfillment
      tags: [trade]
      summary: Update a trade fulfillment record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTradeFulfillment"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeFulfillment"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /steam/connect:
    post:
      operationId: connectSteam
      tags: [steam]
      summary: Connect Steam account (mock OAuth in test env)
      responses:
        "200":
          description: Steam account connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  steamId64:
                    type: ["string", "null"]
                  steamUsername:
                    type: ["string", "null"]
                required: [steamId64, steamUsername]
        "401":
          description: Unauthorized

  /steam/disconnect:
    post:
      operationId: disconnectSteam
      tags: [steam]
      summary: Disconnect Steam account
      responses:
        "200":
          description: Steam account disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        "401":
          description: Unauthorized

  /steam/inventory:
    get:
      operationId: getSteamInventory
      tags: [steam]
      summary: Fetch the authenticated user's CS2 Steam inventory
      responses:
        "200":
          description: Steam inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SteamInventory"
        "400":
          description: Steam ID not configured or inventory is private
        "401":
          description: Unauthorized
        "502":
          description: Steam API error

  /loot-hoard/drop:
    post:
      operationId: manualLootDrop
      tags: [loot-hoard]
      summary: Streamer-initiated manual prize drop (coins or random item) to a viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualDropRequest"
      responses:
        "200":
          description: Drop result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualDropResponse"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /settings:
    get:
      operationId: getBotSettings
      tags: [settings]
      summary: Get current user bot settings
      responses:
        "200":
          description: Bot settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSettings"
        "401":
          description: Unauthorized
    put:
      operationId: updateBotSettings
      tags: [settings]
      summary: Update bot settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBotSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSettings"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /chat-users:
    get:
      operationId: listChatUsers
      tags: [chat-users]
      summary: List all chat users in the streamer's channel with coin balances and inventory
      responses:
        "200":
          description: List of chat users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatUser"
        "401":
          description: Unauthorized

  /chat-users/{username}/inventory/{itemId}:
    delete:
      operationId: removeChatUserInventoryItem
      tags: [chat-users]
      summary: Remove an inventory item from a viewer's pouch (streamer admin action — no coin refund)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Item not found
        "401":
          description: Unauthorized

  /chat-users/loot-table:
    get:
      operationId: getChatUsersLootTable
      tags: [chat-users]
      summary: Return the static loot + buff item tables available to add to a viewer's pouch
      responses:
        "200":
          description: Loot and buff tables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LootTableResponse"
        "401":
          description: Unauthorized

  /chat-users/{username}/inventory:
    post:
      operationId: addChatUserInventoryItem
      tags: [chat-users]
      summary: Add an item from the loot/buff table to a viewer's pouch (streamer admin action)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatUserAddItemBody"
      responses:
        "200":
          description: Item added or pouch full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUserAddItemResult"
        "400":
          description: Unknown item name
        "401":
          description: Unauthorized

  /chat-users/{username}/inventory/{itemId}/sell:
    post:
      operationId: sellChatUserInventoryItem
      tags: [chat-users]
      summary: Sell a viewer's inventory item on their behalf (coins credited to the viewer)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item sold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUserSellItemResult"
        "404":
          description: Item not found
        "401":
          description: Unauthorized

  /chat-users/{username}/inventory/{itemId}/use:
    post:
      operationId: useChatUserInventoryItem
      tags: [chat-users]
      summary: Activate a buff item in a viewer's pouch on their behalf
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Buff activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUserUseItemResult"
        "400":
          description: Not a buff item
        "404":
          description: Item not found
        "401":
          description: Unauthorized

  /chat-users/{username}/redeem:
    post:
      operationId: redeemForChatUser
      tags: [chat-users]
      summary: Redeem coins for giveaway tickets on behalf of a viewer
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatUserRedeemBody"
      responses:
        "200":
          description: Redemption result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUserRedeemResult"
        "400":
          description: No active giveaway or insufficient coins
        "401":
          description: Unauthorized

  /chat-users/{username}/coins:
    post:
      operationId: adjustChatUserCoins
      tags: [chat-users]
      summary: Adjust a chat user's coin balance (positive or negative delta)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustCoinsRequest"
      responses:
        "200":
          description: Adjustment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustCoinsResponse"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /commands/{name}/toggle:
    post:
      operationId: toggleCommand
      tags: [commands]
      summary: Enable or disable a bot command
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Command toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotCommand"

  /commands/{name}/response:
    put:
      operationId: updateCommandResponse
      tags: [commands]
      summary: Set or clear the streamer's custom response template for a built-in command
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommandResponse"
      responses:
        "200":
          description: Updated command config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotCommand"
        "400":
          description: Command is not customizable or input invalid
        "401":
          description: Unauthorized

components:
  parameters:
    StatsRange:
      name: range
      in: query
      description: Time window for stats. `stream` filters since the caller's streamStartedAt.
      schema:
        type: string
        enum: [day, week, month, year, all, stream]
        default: all

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BotStatus:
      type: object
      properties:
        connected:
          type: boolean
        channel:
          type: string
        channels:
          type: array
          items:
            type: string
        username:
          type: string
        uptime:
          type: ["integer", "null"]
        lastMessageAt:
          type: ["string", "null"]
      required:
        - connected
        - channel
        - channels
        - username
        - uptime
        - lastMessageAt

    Giveaway:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        prize:
          type: string
        prizeAssetId:
          type: ["string", "null"]
        prizeIconUrl:
          type: ["string", "null"]
        prizeKind:
          type: string
          enum: [cs2, bot_item, bot_coins]
        prizeBotCoins:
          type: ["integer", "null"]
        prizeBotRarity:
          type: ["string", "null"]
          enum: [common, uncommon, rare, epic, legendary, null]
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, active, ended]
        channel:
          type: string
        keyword:
          type: string
        requireFollower:
          type: boolean
        subscriberOnly:
          type: boolean
        minSubTier:
          type: ["string", "null"]
          enum: ["1000", "2000", "3000", null]
        winnerId:
          type: ["integer", "null"]
        winnerUsername:
          type: ["string", "null"]
        entryCount:
          type: integer
        createdAt:
          type: string
        startedAt:
          type: ["string", "null"]
        endedAt:
          type: ["string", "null"]
      required:
        - id
        - title
        - prize
        - prizeAssetId
        - prizeIconUrl
        - prizeKind
        - prizeBotCoins
        - prizeBotRarity
        - description
        - status
        - channel
        - keyword
        - requireFollower
        - subscriberOnly
        - minSubTier
        - winnerId
        - winnerUsername
        - entryCount
        - createdAt
        - startedAt
        - endedAt

    GiveawayInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        prize:
          type: string
          minLength: 1
        prizeAssetId:
          type: string
        prizeIconUrl:
          type: string
        prizeKind:
          type: string
          enum: [cs2, bot_item, bot_coins]
        prizeBotCoins:
          type: integer
          minimum: 1
        prizeBotRarity:
          type: string
          enum: [common, uncommon, rare, epic, legendary]
        description:
          type: string
        keyword:
          type: string
          minLength: 1
        channel:
          type: string
        requireFollower:
          type: boolean
        subscriberOnly:
          type: boolean
        minSubTier:
          type: string
          enum: ["1000", "2000", "3000"]
      required:
        - title
        - prize
        - keyword

    GiveawayEntry:
      type: object
      properties:
        id:
          type: integer
        giveawayId:
          type: integer
        username:
          type: string
        tickets:
          type: integer
        enteredAt:
          type: string
      required:
        - id
        - giveawayId
        - username
        - tickets
        - enteredAt

    AddGiveawayEntryInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        tickets:
          type: integer
          minimum: 1
          maximum: 99
      required:
        - username

    GiveawayWithEntries:
      type: object
      properties:
        giveaway:
          $ref: "#/components/schemas/Giveaway"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/GiveawayEntry"
      required:
        - giveaway
        - entries

    GiveawayResult:
      type: object
      properties:
        giveaway:
          $ref: "#/components/schemas/Giveaway"
        winner:
          $ref: "#/components/schemas/GiveawayEntry"
      required:
        - giveaway
        - winner

    LootDrop:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        item:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, epic, legendary]
        points:
          type: integer
        channel:
          type: string
        droppedAt:
          type: string
      required:
        - id
        - username
        - item
        - rarity
        - points
        - channel
        - droppedAt

    StatsOverview:
      type: object
      properties:
        totalGiveaways:
          type: integer
        activeGiveaway:
          type: boolean
        totalLootDrops:
          type: integer
        totalCommandsUsed:
          type: integer
        uniqueUsers:
          type: integer
        recentEntries:
          type: integer
      required:
        - totalGiveaways
        - activeGiveaway
        - totalLootDrops
        - totalCommandsUsed
        - uniqueUsers
        - recentEntries

    CommandStat:
      type: object
      properties:
        command:
          type: string
        usageCount:
          type: integer
        lastUsedAt:
          type: ["string", "null"]
      required:
        - command
        - usageCount
        - lastUsedAt

    UserStat:
      type: object
      properties:
        username:
          type: string
        lootCount:
          type: integer
        totalPoints:
          type: integer
        bestRarity:
          type: string
      required:
        - username
        - lootCount
        - totalPoints
        - bestRarity

    BotCommand:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        cooldownSeconds:
          type: integer
        theme:
          type: string
          enum: [goblin, cs2, both]
        aliases:
          type: array
          items:
            type: string
        isCustom:
          type: boolean
        customizable:
          type: boolean
          description: When true, the streamer can override the chat reply via PUT /commands/{name}/response.
        availableTokens:
          type: array
          items:
            type: string
          description: Template tokens this command supports (e.g. user, balance).
        defaultResponse:
          type: ["string", "null"]
          description: Sample default reply, shown next to the customization textarea.
        customResponse:
          type: ["string", "null"]
          description: Streamer's saved override, or null if using the default.
      required:
        - name
        - description
        - enabled
        - cooldownSeconds

    UpdateCommandResponse:
      type: object
      properties:
        response:
          type: string
          description: Override template; pass an empty string to clear and revert to the default.
          maxLength: 400
      required: [response]

    BotSettings:
      type: object
      properties:
        botTheme:
          type: string
          enum: [goblin, cs2]
        botName:
          type: string
        steamTradeUrl:
          type: ["string", "null"]
        steamId64:
          type: ["string", "null"]
        steamUsername:
          type: ["string", "null"]
        goblinEventsEnabled:
          type: boolean
        lootDropsEnabled:
          type: boolean
        coinRedemptionEnabled:
          type: boolean
        coinCap:
          type: ["integer", "null"]
        wheelMode:
          type: string
          enum: [auto, manual]
        wheelSpeed:
          type: string
          enum: [slow, medium, fast]
        eliminationFlavorEnabled:
          type: boolean
      required:
        - botTheme
        - botName
        - steamTradeUrl
        - steamId64
        - steamUsername
        - goblinEventsEnabled
        - lootDropsEnabled
        - coinRedemptionEnabled
        - coinCap
        - wheelMode
        - wheelSpeed
        - eliminationFlavorEnabled

    UpdateBotSettings:
      type: object
      properties:
        botTheme:
          type: string
          enum: [goblin, cs2]
        botName:
          type: string
        steamTradeUrl:
          type: ["string", "null"]
        steamId64:
          type: ["string", "null"]
        steamUsername:
          type: ["string", "null"]
        goblinEventsEnabled:
          type: boolean
        lootDropsEnabled:
          type: boolean
        coinRedemptionEnabled:
          type: boolean
        coinCap:
          type: ["integer", "null"]
        wheelMode:
          type: string
          enum: [auto, manual]
        wheelSpeed:
          type: string
          enum: [slow, medium, fast]
        eliminationFlavorEnabled:
          type: boolean

    ManualDropRequest:
      type: object
      properties:
        username:
          type: string
        kind:
          type: string
          enum: [coins, item]
        coins:
          type: integer
        rarity:
          type: string
          enum: [common, uncommon, rare, epic, legendary]
      required:
        - username
        - kind

    ManualDropResponse:
      type: object
      properties:
        ok:
          type: boolean
        kind:
          type: string
          enum: [coins, item]
        username:
          type: string
        coinsAwarded:
          type: ["integer", "null"]
        itemAwarded:
          type: ["string", "null"]
        rarity:
          type: ["string", "null"]
        inventoryFull:
          type: boolean
      required:
        - ok
        - kind
        - username
        - coinsAwarded
        - itemAwarded
        - rarity
        - inventoryFull

    TradeFulfillment:
      type: object
      properties:
        id:
          type: integer
        giveawayId:
          type: integer
        winnerTwitchUsername:
          type: string
        prize:
          type: string
        steamTradeUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, trade_locked, sent, skipped]
        tradeLockUntil:
          type: ["string", "null"]
        streamerNotes:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - giveawayId
        - winnerTwitchUsername
        - prize
        - steamTradeUrl
        - status
        - tradeLockUntil
        - streamerNotes
        - createdAt

    UpdateTradeFulfillment:
      type: object
      properties:
        status:
          type: string
          enum: [pending, trade_locked, sent, skipped]
        steamTradeUrl:
          type: ["string", "null"]
        tradeLockUntil:
          type: ["string", "null"]
        streamerNotes:
          type: ["string", "null"]

    SteamInventoryItem:
      type: object
      properties:
        assetId:
          type: string
        classId:
          type: string
        name:
          type: string
        marketHashName:
          type: string
        iconUrl:
          type: string
        tradable:
          type: boolean
        rarityColor:
          type: string
        rarityName:
          type: string
        wear:
          type: ["string", "null"]
        type:
          type: string
      required:
        - assetId
        - classId
        - name
        - marketHashName
        - iconUrl
        - tradable
        - rarityColor
        - rarityName
        - wear
        - type

    SteamInventory:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SteamInventoryItem"
        totalCount:
          type: integer
      required:
        - items
        - totalCount

    PointsBalance:
      type: object
      properties:
        username:
          type: string
        earned:
          type: integer
        redeemed:
          type: integer
        balance:
          type: integer
        cap:
          type: ["integer", "null"]
        costPerEntry:
          type: integer
      required:
        - username
        - earned
        - redeemed
        - balance
        - costPerEntry

    RedeemEntriesInput:
      type: object
      properties:
        entries:
          type: integer
          minimum: 1
      required:
        - entries

    RedemptionResult:
      type: object
      properties:
        ticketsAdded:
          type: integer
        pointsSpent:
          type: integer
        balanceAfter:
          type: integer
      required:
        - ticketsAdded
        - pointsSpent
        - balanceAfter

    UserInventoryItem:
      type: object
      properties:
        id:
          type: integer
        item:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, epic, legendary]
        kind:
          type: string
          enum: [item, buff]
        buffEffect:
          type: ["string", "null"]
          enum: [luck, coins, tickets, null]
        coinValue:
          type: integer
        chargesRemaining:
          type: integer
        isActive:
          type: boolean
        acquiredAt:
          type: string
      required:
        - id
        - item
        - rarity
        - kind
        - buffEffect
        - coinValue
        - chargesRemaining
        - isActive
        - acquiredAt

    UserInventory:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserInventoryItem"
        cap:
          type: integer
        balance:
          type: integer
        costPerEntry:
          type: integer
      required:
        - items
        - cap
        - balance
        - costPerEntry

    SellItemResult:
      type: object
      properties:
        coinsEarned:
          type: integer
        balanceAfter:
          type: integer
      required:
        - coinsEarned
        - balanceAfter

    UseItemResult:
      type: object
      properties:
        item:
          type: string
        buffEffect:
          type: string
        chargesRemaining:
          type: integer
      required:
        - item
        - buffEffect
        - chargesRemaining

    ChatUserInventoryItem:
      type: object
      properties:
        id:
          type: integer
        slot:
          type: integer
        item:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, epic, legendary]
        kind:
          type: string
        buffEffect:
          type: string
          nullable: true
        coinValue:
          type: integer
        chargesRemaining:
          type: integer
        isActive:
          type: boolean
      required:
        - id
        - slot
        - item
        - rarity
        - kind
        - coinValue
        - chargesRemaining
        - isActive

    LootTableItem:
      type: object
      properties:
        item: { type: string }
        rarity: { type: string, enum: [common, uncommon, rare, epic, legendary] }
        points: { type: integer }
        theme: { type: string, enum: [goblin, cs2] }
      required: [item, rarity, points, theme]

    BuffTableItem:
      type: object
      properties:
        item: { type: string }
        rarity: { type: string, enum: [common, uncommon, rare, epic, legendary] }
        effect: { type: string }
        charges: { type: integer }
        coinValue: { type: integer }
        flavor: { type: string }
      required: [item, rarity, effect, charges, coinValue, flavor]

    LootTableResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LootTableItem"
        buffs:
          type: array
          items:
            $ref: "#/components/schemas/BuffTableItem"
      required: [items, buffs]

    ChatUserAddItemBody:
      type: object
      properties:
        itemName:
          type: string
          description: Exact item name from the loot or buff table.
      required: [itemName]

    ChatUserAddItemResult:
      type: object
      properties:
        ok: { type: boolean }
        reason: { type: string, nullable: true }
        slot: { type: integer, nullable: true }
        used: { type: integer }
        cap: { type: integer }
      required: [ok, used, cap]

    ChatUserSellItemResult:
      type: object
      properties:
        ok: { type: boolean }
        coinsEarned: { type: integer }
        balanceAfter: { type: integer }
      required: [ok, coinsEarned, balanceAfter]

    ChatUserUseItemResult:
      type: object
      properties:
        ok: { type: boolean }
        item: { type: string }
        buffEffect: { type: string }
        chargesRemaining: { type: integer }
      required: [ok, item, buffEffect, chargesRemaining]

    ChatUserRedeemBody:
      type: object
      properties:
        entries: { type: integer }
        giveawayId: { type: integer, nullable: true }
      required: [entries]

    ChatUserRedeemResult:
      type: object
      properties:
        ok: { type: boolean }
        pointsSpent: { type: integer, nullable: true }
        ticketsAdded: { type: integer, nullable: true }
        balanceAfter: { type: integer, nullable: true }
        code: { type: string, nullable: true }
        message: { type: string, nullable: true }
      required: [ok]

    AdminBypassBody:
      type: object
      properties:
        email: { type: string }
        code: { type: string }
      required: [email, code]

    AdminBypassResult:
      type: object
      properties:
        ticket: { type: string }
      required: [ticket]

    ChatUserTwitchInfo:
      type: object
      description: |
        Best-effort Twitch enrichment — absent (null on ChatUser) when the streamer's
        stored token predates the expanded OAuth scopes (moderator:read:followers,
        channel:read:subscriptions). Re-linking Twitch from the Account page
        refreshes the token with the required scopes.
      properties:
        followedAt:
          type: string
          nullable: true
          description: ISO-8601 timestamp of when this user followed the channel, or null if not a follower / scope unavailable.
        isSubscriber:
          type: boolean
          nullable: true
        subTier:
          type: string
          nullable: true
          description: "Twitch subscription tier: '1000' = T1, '2000' = T2, '3000' = T3, or null."
      required:
        - followedAt
        - isSubscriber
        - subTier

    ChatUser:
      type: object
      properties:
        username:
          type: string
        coins:
          type: integer
        inventoryCount:
          type: integer
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/ChatUserInventoryItem"
        twitch:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ChatUserTwitchInfo"
      required:
        - username
        - coins
        - inventoryCount
        - inventory
        - twitch

    EndGiveawayRequest:
      type: object
      description: |
        Optional payload for `POST /giveaway/{id}/end`. The dashboard's
        elimination wheel passes the locally-chosen winner here; automated
        / scripted callers may omit the body entirely and the server will
        fall back to a weighted-random pick.
      properties:
        winnerUsername:
          type: string
          description: Lowercased Twitch username chosen by the wheel. Must be present in the giveaway's entries.

    AdjustCoinsRequest:
      type: object
      properties:
        delta:
          type: integer
        reason:
          type: string
      required:
        - delta

    AdjustCoinsResponse:
      type: object
      properties:
        ok:
          type: boolean
        username:
          type: string
        balance:
          type: integer
      required:
        - ok
        - username
        - balance

    StreamStatus:
      type: object
      properties:
        streamStartedAt:
          type: ["string", "null"]
        isLive:
          type: boolean
      required:
        - streamStartedAt
        - isLive

    EngagementTip:
      type: object
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [info, warn]
        title:
          type: string
        detail:
          type: string
      required: [id, severity, title, detail]

    EngagementReport:
      type: object
      properties:
        range:
          type: string
        since:
          type: ["string", "null"]
        metrics:
          type: object
          properties:
            totalLoot:
              type: integer
            totalCommands:
              type: integer
            totalGiveaways:
              type: integer
            uniqueChatters:
              type: integer
          required: [totalLoot, totalCommands, totalGiveaways, uniqueChatters]
        tips:
          type: array
          items:
            $ref: "#/components/schemas/EngagementTip"
      required: [range, metrics, tips]

    GiveawayPreset:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        prize:
          type: string
        prizeKind:
          type: string
          enum: [cs2, bot_item, bot_coins]
        prizeBotCoins:
          type: ["integer", "null"]
        prizeBotRarity:
          type: ["string", "null"]
        keyword:
          type: string
        requireFollower:
          type: boolean
        subscriberOnly:
          type: boolean
        minSubTier:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - title
        - prize
        - prizeKind
        - keyword
        - requireFollower
        - subscriberOnly
        - createdAt

    CreateGiveawayPreset:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        prize:
          type: string
        prizeKind:
          type: string
          enum: [cs2, bot_item, bot_coins]
        prizeBotCoins:
          type: integer
        prizeBotRarity:
          type: string
          enum: [common, uncommon, rare, epic, legendary]
        keyword:
          type: string
        requireFollower:
          type: boolean
        subscriberOnly:
          type: boolean
        minSubTier:
          type: string
          enum: ["1000", "2000", "3000"]
      required:
        - title
        - prize
